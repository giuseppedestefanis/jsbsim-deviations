[project]
name = "devsig"
version = "0.1.0"
description = "Detecting and explaining behavioural regressions in flight dynamics models (JSBSim)"
requires-python = ">=3.14"
dependencies = ["jsbsim==1.3.1", "pandas==3.0.5", "numpy==2.5.3", "scikit-learn==1.9.0", "scipy==1.18.1", "matplotlib==3.11.1", "pyarrow==25.0.1"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["devsig"]
